name: desktop-hwsim

# Privileged mac80211_hwsim no-leak harness (ROADMAP P0.2): drives the REAL
# gatepath-netns-helper end-to-end on a virtual radio — PHY move into a throwaway
# netns, in-netns wpa_supplicant + DHCP, portal, and the trusted-net sentinel.
#
# This runs on a SELF-HOSTED runner (label `gatepath-hwsim`), NOT a GitHub-hosted
# one: GitHub's hosted runners use an Azure cloud kernel that ships no
# mac80211_hwsim (confirmed — `modinfo mac80211_hwsim` is "not found" even after
# installing linux-modules-extra). The box behind the runner must have the
# virtual-radio stack (e.g. the Bazzite dev box where this harness is validated
# 3/3). See tests/e2e-hwsim/README.md → "Running in CI" for runner setup.
#
# SECURITY: manual-dispatch ONLY. This executes privileged repo code as root on
# your box, so it is deliberately NOT auto-triggered by pull_request/push — you
# decide when to run it, on code you've reviewed.
on:
  workflow_dispatch:
    inputs:
      dhcp:
        description: 'DHCP mode passed to run.sh'
        default: static
        type: choice
        options: [static, real]

jobs:
  e2e-hwsim:
    name: Desktop E2E (mac80211_hwsim, privileged)
    runs-on: [self-hosted, gatepath-hwsim]
    timeout-minutes: 30
    steps:
      # MUST come before checkout. run.sh already sets PYTHONDONTWRITEBYTECODE=1
      # so it stops CREATING root-owned .pyc in the reused workspace — but that
      # prevention can never take effect while residue from an earlier run is
      # still present, because checkout is step 1 and run.sh is step 3.
      # actions/checkout dies trying to unlink the leftovers:
      #
      #   EACCES: permission denied, unlink '.../mockportal/__pycache__/*.pyc'
      #
      # and the job is over in ~4s having proven nothing. Every dispatch since
      # 2026-06-30 failed exactly here, including 30660617917.
      #
      # Note the residue is owned by `nobody`, not by uid 0 — the harness writes
      # it from inside a user namespace, so a userns-mapped root lands as 65534
      # outside. Searching for root-owned files finds nothing and looks clean.
      #
      # Scoped to the runner's own scratch workspace, which actions/checkout
      # recreates from scratch on the next line.
      - name: Clear foreign-owned residue from the reused workspace
        run: |
          set -euo pipefail
          target="${GITHUB_WORKSPACE:?}"
          if [ ! -d "$target" ]; then
            echo "workspace does not exist yet — nothing to clear"
            exit 0
          fi
          stale=$(sudo find "$target" ! -user "$(id -un)" -print 2>/dev/null | wc -l)
          if [ "$stale" -eq 0 ]; then
            echo "workspace is clean (no foreign-owned entries)"
            exit 0
          fi
          echo "removing $stale foreign-owned entr(y|ies) left by a previous run:"
          sudo find "$target" ! -user "$(id -un)" -print 2>/dev/null | head -20
          sudo find "$target" ! -user "$(id -un)" -delete 2>/dev/null || true
          remaining=$(sudo find "$target" ! -user "$(id -un)" -print 2>/dev/null | wc -l)
          if [ "$remaining" -ne 0 ]; then
            echo "::error::could not clear $remaining foreign-owned entr(y|ies); checkout will fail"
            sudo find "$target" ! -user "$(id -un)" -print 2>/dev/null | head -20
            exit 1
          fi
          echo "workspace cleared"

      - uses: actions/checkout@v7

      # Builds the helper as the (non-root) runner user; bootstraps rustup into
      # ~/.cargo if cargo isn't already on PATH. Bakes the hwsim runner path in
      # via GATEPATH_PORTAL_RUNNER_PATH (option_env!), so the shipping default is
      # untouched.
      - name: Build the privileged helper
        run: bash tests/e2e-hwsim/build-helper.sh

      # run.sh needs root (netns + PHY move + module load). The runner user must
      # have passwordless sudo for this (see README). The harness does its own
      # host setup (radios, AP netns, NM connect, polkit/dbus install) and tears
      # everything down unconditionally via an EXIT/INT/TERM trap.
      - name: Run the hwsim no-leak harness
        run: sudo bash tests/e2e-hwsim/run.sh --dhcp "${{ inputs.dhcp }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-hwsim-artifacts
          path: |
            /tmp/gatepath-hwsim*
          if-no-files-found: ignore
